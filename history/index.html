const AGAIN=3,STEPS=[5,10,15,30],RELEARN=[10],GRAD=60,EASY_GRAD=180,MAX=480,MIN_EASE=1.3; // минуты; MAX — потолок интервала

const get=c=>S[c.id]||{s:'new',step:0,ivl:0,ease:2,due:0,r:0,lapses:0};
function sched(c,g,now){return{...sched0(c,g,now),lg:g}}
function sched0(c,g,now){const x={...get(c)};const min=m=>now+m*60000;
if(x.s==='new'){x.s='learn';x.step=0;x.r=0}
if(x.s==='learn'){const st=x.r?RELEARN:STEPS;
 if(g===1){x.step=0;x.due=min(AGAIN)}
 else if(g===2){x.due=min(st[x.step])}
 else{const grad=g===4||x.step+1>=st.length;
  if(grad){x.ivl=x.r?Math.max(x.ivl,g===4?120:0):(g===4?EASY_GRAD:GRAD);x.s='review';x.r=0;x.step=0;x.due=min(x.ivl)}
  else{x.step++;x.due=min(st[x.step])}}
 return x}
if(g===1){x.lapses++;x.ease=Math.max(MIN_EASE,x.ease-.2);x.ivl=Math.max(30,Math.round(x.ivl*.4));x.s='learn';x.r=1;x.step=0;x.due=min(AGAIN)}
else{const p=x.ivl;
 if(g===2){x.ivl=p*1.2;x.ease=Math.max(MIN_EASE,x.ease-.15)}
 else if(g===3)x.ivl=p*x.ease;
 else{x.ivl=p*x.ease*1.3;x.ease+=.15}
 x.ivl=Math.min(MAX,Math.max(Math.round(x.ivl),p+1));x.due=min(x.ivl)}
return x}
function fmt(m){if(m<1)return'<1 мин';if(m<60)return Math.round(m)+' мин';if(m<1440)return(Math.round(m/6)/10+'').replace('.',',')+' ч';return Math.round(m/144)/10+' дн'}
const pool=()=>CARDS.filter(c=>!sel.length||sel.includes(c.t));

return p.find(c=>get(c).s==='new')||null}

  const b=$('early');b.hidden=false;b.onclick=e=>{e.stopPropagation();early();render()}}

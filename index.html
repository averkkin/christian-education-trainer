<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тренажер: Христианское образование</title>
<style>
:root{--bg:#f6f4ef;--fg:#222;--card:#fff;--ac:#7a4b2a;--ok:#2e7d32;--no:#c62828;--mu:#777}
@media(prefers-color-scheme:dark){:root{--bg:#191817;--fg:#eee;--card:#262422;--ac:#d9a066;--mu:#999}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:640px;padding:16px}h1{font-size:20px;margin:8px 0}
.bar{height:8px;background:#8884;border-radius:4px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok);width:0}
.stats{color:var(--mu);font-size:14px;display:flex;justify-content:space-between}
.card{background:var(--card);border-radius:14px;padding:26px 22px;min-height:240px;margin:14px 0;box-shadow:0 2px 12px #0002;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.tag{align-self:flex-start;font-size:12px;background:#8882;color:var(--ac);padding:3px 10px;border-radius:99px;margin-bottom:12px}
.lbl{font-size:12px;color:var(--ac);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.q{font-size:21px;font-weight:600}.note{margin-top:10px;font-size:14px;color:var(--mu);font-style:italic}
.a{margin-top:18px;padding-top:14px;border-top:1px solid #8884}
.row{display:flex;gap:10px;flex-wrap:wrap}button{flex:1;padding:13px;border:0;border-radius:10px;font-size:16px;cursor:pointer;background:var(--ac);color:#fff}
button.ok{background:var(--ok)}button.no{background:var(--no)}button.g{background:#8883;color:var(--fg)}
button[hidden]{display:none}.opt{margin-top:14px;display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--mu);align-items:center}
select{max-width:100%;padding:6px;border-radius:8px;background:var(--card);color:var(--fg);border:1px solid #8886}
.done{text-align:center;padding:40px 0}
</style></head><body><main>
<h1>Христианское образование — тренажер</h1>
<div class="stats"><span id="s1"></span><span id="s2"></span></div><div class="bar"><i id="b"></i></div>
<div class="card" id="card"></div>
<div class="row"><button id="show" class="g">Показать ответ (пробел)</button><button id="no" class="no" hidden>Не знаю (←)</button><button id="ok" class="ok" hidden>Знаю (→)</button></div>
<div class="opt"><select id="sec"></select></div>
<div class="opt"><label><input type="checkbox" id="rev"> Ответ → вопрос</label><label><input type="checkbox" id="onlyhard"> Только неизученные</label><a href="#" id="reset" style="color:var(--mu)">Сбросить прогресс</a></div>
</main><script>
const CARDS=[{"q": "Что такое христианское образование?", "a": "теологическая дисциплина, использующая достижения наук о поведении.", "t": "Что такое христианское образование"}, {"q": "Что является основой Ветхозаветного учения?", "a": "Верность Богу — как отдельного человека, так и общества в целом.", "t": "Что такое христианское образование"}, {"q": "Первый учитель Израиля?", "a": "Бог.", "t": "Что такое христианское образование"}, {"q": "Где евреи изначально получали образование?", "a": "Семья.", "t": "Что такое христианское образование"}, {"q": "Какие новые темы появляются в обучении в Новом Завете?", "a": "Верность Богу остаётся; обращение ко Христу; возрастание в вере — человека и общества.", "t": "Что такое христианское образование"}, {"q": "Кто был учителями в Новом Завете?", "a": "Бог (Христос — Бог); руководство церкви — старейшины.", "t": "Что такое христианское образование"}, {"q": "Задача христианского образования?", "a": "Привести учеников ко Христу и способствовать духовному возрастанию человека и всего общества (также: научить человека отдать всю жизнь Богу).", "t": "Что такое христианское образование"}, {"q": "Что делает образование христианским?", "a": "Богословие — если исключить из образования богословие, оно перестаёт быть христианским; христианским называется образование, основанное на Библии.", "t": "Что такое христианское образование"}, {"q": "Цель христианского образования?", "a": "Дать человеку понять, во что он верит, и как это применять на практике; короче говоря — духовное возрастание. (Дополнение на записи: «Духовного возрастания нет без самораспятия».)", "t": "Что такое христианское образование"}, {"q": "Кто выступает в роли учителя в христианском образовании?", "a": "Бог.", "t": "Учитель, программа и аспекты образования в Церкви"}, {"q": "Что лежит в основе программы христианского образования?", "a": "Библия, Писание.", "t": "Учитель, программа и аспекты образования в Церкви"}, {"q": "Кто в христианском образовании выступает в качестве учителей?", "a": "Люди в церкви.", "t": "Учитель, программа и аспекты образования в Церкви"}, {"q": "5 аспектов образования в Церкви?", "a": "Поклонение, христианское общение, благовестие, чистая совесть и служение.", "t": "Учитель, программа и аспекты образования в Церкви"}, {"q": "Каковы основные философские предпосылки христианского образования?", "a": "Сформулировать философию, основа которой — Христос.", "t": "Философские, психологические и богословские основы"}, {"q": "Три подхода к познанию.", "a": "Эмпирический — научное исследование, вычисления, опыты; рационалистический — логика, индукция, дедукция; опыт — интуиция, совесть, внутреннее познание.", "t": "Философские, психологические и богословские основы"}, {"q": "Назовите психологические основы образования.", "a": "Психология как «наука о поведении» — целостная дисциплина, использующая достижения наук о поведении.", "t": "Философские, психологические и богословские основы"}, {"q": "Назовите историко-философские основы образования.", "a": "Философия — естественная и неотъемлемая составляющая христианского образования.", "t": "Философские, психологические и богословские основы"}, {"q": "Назовите библейско-богословские основы образования.", "a": "Писание — основа всего христианского образования; христианским называется образование, основанное на Библии.", "t": "Философские, психологические и богословские основы"}, {"q": "Что такое модель христианского образования?", "a": "Это то, как нужно вести занятия, чтобы учащиеся возрастали в Господе.", "t": "«Модель христианского образования» (схема)"}, {"q": "Что лежит в основе «Модели образования»?", "a": "Библия и [человеческие] потребности.", "t": "«Модель христианского образования» (схема)", "c": "Речь о «Модели образования» — схеме, описанной в вопросах 19–26 (основание, столпы, кровля, окружение)."}, {"q": "Два вида человеческих потребностей.", "a": "Общие и конкретные.", "t": "«Модель христианского образования» (схема)", "c": "Речь о человеческих потребностях в рамках «Модели образования»."}, {"q": "Что является столпами «Модели образования»?", "a": "Мышление, чувство и отношения (три столпа).", "t": "«Модель христианского образования» (схема)", "c": "Речь о «Модели образования» (схема из вопросов 19–26)."}, {"q": "Три столпа мышления.", "a": "Познание, разумение и премудрость.", "t": "«Модель христианского образования» (схема)", "c": "Речь о «Модели образования»: три столпа мышления — часть схемы."}, {"q": "Кровля «Модели образования»?", "a": "Рост во Христе.", "t": "«Модель христианского образования» (схема)", "c": "Речь о «Модели образования» (схема из вопросов 19–26)."}, {"q": "4 направления роста Церкви.", "a": "Численный рост, органический рост, рост воплощения, личное возрастание каждого верующего.", "t": "«Модель христианского образования» (схема)", "c": "Направления роста Церкви — часть темы о возрастании (кровля «Модели образования»)."}, {"q": "Что окружает «Модель образования»?", "a": "Святой Дух.", "t": "«Модель христианского образования» (схема)", "c": "Речь о «Модели образования» (схема из вопросов 19–26)."}, {"q": "Духовная триада образования (3 основных момента, через которые Дух Святой действует в христианском образовании).", "a": "Молитва, приоритеты, положение.", "t": "«Модель христианского образования» (схема)", "c": "Речь о Святом Духе в «Модели образования» (окружение схемы)."}, {"q": "Три вещи, которые необходимы для процесса ученичества.", "a": "Учитель, учение, ученик.", "t": "Особое откровение"}, {"q": "Особое откровение — это…", "a": "Личное самораскрытие [Бога] отдельным людям в определённое время и в определённом месте, позволяющее им вступить в личные взаимоотношения с Богом.", "t": "Особое откровение"}, {"q": "Три уровня ученичества Ветхого Завета.", "a": "Национальный, Индивидуальный, Уровень общения.", "t": "Ученичество в Ветхом Завете и модель особого откровения"}, {"q": "Какими терминами (фразами) Библия определяет ученичество?", "a": "Следовать за Богом и ходить Его путями.", "t": "Ученичество в Ветхом Завете и модель особого откровения", "c": "Речь о ветхозаветной модели ученичества («модель особого откровения»)."}, {"q": "Основные характеристики взаимоотношений ученичества в «модели особого откровения».", "a": "1) Отношения ученика и учителя созданы Богом. 2) Бог определяет цель этих взаимоотношений. 3) Ученик — слуга своего учителя. 4) Ученик принимает служение учителя после его смерти.", "t": "Ученичество в Ветхом Завете и модель особого откровения", "c": "Речь о модели особого откровения (ветхозаветная модель отношений учитель–ученик)."}, {"q": "Обозначьте разницу понятий «учащийся» и «ученик» в Греции.", "a": "Ключевая характеристика ученика (в отличие от учащегося) — неотступность.", "t": "Ученичество в Ветхом Завете и модель особого откровения", "c": "Сравниваются понятия «учащийся» (μαθητής в бытовом смысле) и «ученик» в античной Греции."}, {"q": "Какое изменение в ветхозаветной модели отношений между учителем и учеником происходит в результате нарушения Израилем завета?", "a": "Распространяется влияние языческого мышления.", "t": "Фарисейская модель vs модель особого откровения", "c": "Речь о ветхозаветной модели отношений учитель–ученик (модель особого откровения)."}, {"q": "Назовите 4 основные отличия модели особого откровения от фарисейской модели.", "a": "1) Кто инициатор отношений — в модели особого откровения учитель, у фарисеев ученик. 2) Кто ставит цель обучения — Бог vs учитель. 3) Ориентация ученика — на служение vs на прислуживание учителю. 4) Устойчивость и цель отношений — длительные, Бог занимает место учителя vs могли прерваться учеником, конечная цель — просто получение знаний. (Дополнительно: харизматический элемент есть/отсутствует; стабильность vs дробление на школы; «учитель решает, что истина» vs принцип традиций.)", "t": "Фарисейская модель vs модель особого откровения", "c": "Сравниваются модель особого откровения (библейская) и фарисейская модель (раввинистическая) ученичества."}, {"q": "Главная обучающая цель Иисуса?", "a": "Пробуждение безусловного посвящения — не «Богу», а именно личности [Христа] («не как Богу, а просто как личности»); формула — «Следуй за Мной».", "t": "Иисус-Учитель и христианское образование сегодня"}, {"q": "Самое большое различие между светским и христианским образованием?", "a": "Продолжение дела Иисуса Святым Духом — просвещающая деятельность Святого Духа, которой нет в светском образовании.", "t": "Иисус-Учитель и христианское образование сегодня"}],SECS=["Что такое христианское образование", "Учитель, программа и аспекты образования в Церкви", "Философские, психологические и богословские основы", "«Модель христианского образования» (схема)", "Особое откровение", "Ученичество в Ветхом Завете и модель особого откровения", "Фарисейская модель vs модель особого откровения", "Иисус-Учитель и христианское образование сегодня"];
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let st=ld('st',{}),cfg=ld('cfg',{}),queue=[],cur=null,shown=false;
const $=id=>document.getElementById(id);
$('sec').innerHTML='<option value="">Все разделы</option>'+SECS.map(s=>'<option>'+s+'</option>').join('');
$('sec').value=cfg.sec||'';$('rev').checked=!!cfg.rev;$('onlyhard').checked=!!cfg.hard;
const known=i=>(st[i]||0)>=2;
function saveCfg(){sv('cfg',{sec:$('sec').value,rev:$('rev').checked,hard:$('onlyhard').checked})}
function build(){saveCfg();let ids=CARDS.map((_,i)=>i);const s=$('sec').value;
if(s)ids=ids.filter(i=>CARDS[i].t===s);if($('onlyhard').checked)ids=ids.filter(i=>!known(i));
for(let i=ids.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[ids[i],ids[j]]=[ids[j],ids[i]]}queue=ids;next()}
function stats(){const k=CARDS.filter((_,i)=>known(i)).length;$('s1').textContent='Выучено: '+k+' / '+CARDS.length;$('s2').textContent='В очереди: '+queue.length;$('b').style.width=k/CARDS.length*100+'%'}
function next(){sv('q',{queue,key:$('sec').value+'|'+$('onlyhard').checked});stats();shown=false;$('show').hidden=false;$('ok').hidden=$('no').hidden=true;
if(!queue.length){cur=null;$('card').innerHTML='<div class="done"><h2>Круг пройден 🎉</h2><p>Смените раздел или начните заново.</p><button onclick="build()">Заново</button></div>';$('show').hidden=true;return}
cur=queue[0];const c=CARDS[cur],r=$('rev').checked;
$('card').innerHTML='<span class="tag"></span><div class="lbl"></div><div class="q"></div>';
const e=$('card');e.querySelector('.tag').textContent=c.t;e.querySelector('.lbl').textContent=(r?'Ответ':'Вопрос')+' №'+(cur+1);e.querySelector('.q').textContent=r?c.a:c.q;
if(c.c){const n=document.createElement('div');n.className='note';n.textContent='Контекст: '+c.c;e.append(n)}}
function reveal(){if(cur===null||shown)return;shown=true;const c=CARDS[cur],r=$('rev').checked;
const d=document.createElement('div');d.className='a';const l=document.createElement('div');l.className='lbl';l.textContent=r?'Вопрос':'Ответ';const t=document.createElement('div');t.textContent=r?c.q:c.a;d.append(l,t);$('card').append(d);
$('show').hidden=true;$('ok').hidden=$('no').hidden=false}
function answer(good){if(!shown)return;const i=queue.shift();
if(good){st[i]=(st[i]||0)+1}else{st[i]=0;queue.splice(Math.min(3,queue.length),0,i)}sv('st',st);next()}
$('show').onclick=reveal;$('card').onclick=()=>shown||reveal();$('ok').onclick=()=>answer(1);$('no').onclick=()=>answer(0);
$('rev').onchange=()=>{saveCfg();next()};$('onlyhard').onchange=$('sec').onchange=()=>build();
$('reset').onclick=e=>{e.preventDefault();if(confirm('Сбросить прогресс?')){st={};sv('st',st);build()}};
document.onkeydown=e=>{if(e.key===' '){e.preventDefault();shown||reveal()}else if(e.key==='ArrowRight')answer(1);else if(e.key==='ArrowLeft')answer(0)};
const sq=ld('q',null);
if(sq&&sq.key===$('sec').value+'|'+$('onlyhard').checked&&Array.isArray(sq.queue)&&sq.queue.every(i=>CARDS[i])){queue=sq.queue;next()}else build();
</script></body></html>

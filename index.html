<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тренажер: Христианское образование</title>
<style>
:root{--bg:#f6f4ef;--fg:#222;--card:#fff;--ac:#7a4b2a;--ok:#2e7d32;--no:#c62828;--mu:#777}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,sans-serif;display:flex;justify-content:center}

.q,.a{white-space:pre-line}.a{margin-top:18px;padding-top:14px;border-top:1px solid #8884}
.row{display:flex;gap:10px;flex-wrap:wrap}button{flex:1;padding:13px;border:0;border-radius:10px;font-size:16px;cursor:pointer;background:var(--ac);color:#fff}

button[hidden]{display:none}.opt{margin-top:14px;display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--mu);align-items:center}

.done{text-align:center;padding:40px 0}
</style></head><body><main>

лем и учеником происходит в результате нарушений Израилем завета?", "a": "Распространяется влияние языческого мышления.", "t": "Фарисейская модель vs модель особого откровения", "c": "Речь о ветхозаветной модели отношений учитель–ученик (модель особого откровения)."}, {"q": "Назовите 4 основные отличия модели особого откровения от фарисейской.", "a": "Отношения инициирует ученик\nУчитель ставит цель изучения\nУченик прислуживает учителю\nКонечная цель — получение знаний", "t": "Фарисейская модель vs модель особого откровения", "c": "Ответ перечисляет черты фарисейской модели — в отличие от модели особого откровения (вопросы 29–32)."}, {"q": "Главная обучающая цель Иисуса?", "a": "Пробуждение безусловного посвящения себе.", "t": "Иисус-Учитель и христианское образование сегодня"}, {"q": "Самое большое различие между светским и христианским образованием?", "a": "Идея просвещающей деятельности Святого Духа.", "t": "Иисус-Учитель и христианское образование сегодня"}, {"q": "На что в обучении обращает внимание бихевиористская теория?", "a": "На поведение.", "t": "Бихевиористская теория обучения"}, {"q": "Какое название получила теория, основанная на связи между стимулом и реакцией?", "a": "Классическое обусловливание.", "t": "Бихевиористская теория обучения"}, {"q": "Какой вклад внёс закон эффекта Торндайка?", "a": "Важность мотивации.", "t": "Бихевиористская теория обучения"}, {"q": "Что происходит при позитивном подкреплении по Скиннеру?", "a": "Даём нечто желаемое.", "t": "Бихевиористская теория обучения"}, {"q": "Что происходит при негативном подкреплении?", "a": "Забираем нежелательное.", "t": "Бихевиористская теория обучения", "c": "Речь о подкреплении по Скиннеру (вопрос выше)."}, {"q": "Режимы подкрепления?", "a": "Позитивное, негативное; непрерывное и прерывистое.", "t": "Бихевиористская теория обучения"}, {"q": "Что такое угасание?", "a": "Прекращение реакции в результате отсутствия подкрепления.", "t": "Бихевиористская теория обучения", "c": "Речь о бихевиористской теории (подкрепление)."}, {"q": "Два наиболее распространённых способа поощрения желательного поведения?", "a": "Похвала и принцип Примака.", "t": "Бихевиористская теория обучения"}, {"q": "Ключевые принципы обучения открытия Брунера?", "a": "Структура, мотивация и преподаватель.", "t": "Теория открытия и конструктивизм"}, {"q": "Что подчёркивает конструктивизм в процессе формирования знаний?", "a": "Важность активного участия учащегося в процессе формирования знаний.", "t": "Теория открытия и конструктивизм"}, {"q": "Что такое кратковременная память?", "a": "Ограниченная часть памяти; система обработки информации с ограниченным числом информационных единиц.", "t": "Память"}, {"q": "Чему уделяет внимание гуманистическая теория?", "a": "Ценностям и отношениям.", "t": "Гуманистическая теория"}, {"q": "Гуманизм со строчной буквы — это?", "a": "Система мышления, которая сосредотачивается на человеке, его ценностях, способностях и значимости.", "t": "Гуманистическая теория"}, {"q": "Гуманизм с прописной буквы — это?", "a": "Интеллектуальное движение эпохи Возрождения.", "t": "Гуманистическая теория"}, {"q": "Какие виды гуманизма вы знаете?", "a": "Светский, классический и в сфере образования.", "t": "Гуманистическая теория"}, {"q": "Какая человеческая составляющая стоит в центре?", "a": "Воля.", "t": "Триада человеческого опыта", "c": "Речь о триаде человеческого опыта (христианского образования)."}],SECS=["Что такое христианское образование", "Учитель, программа и аспекты образования в Церкви", "Философские, психологические и богословские основы", "«Модель христианского образования» (схема)", "Особое откровение", "Ученичество в Ветхом Завете и модель особого откровения", "Фарисейская модель vs модель особого откровения", "Иисус-Учитель и христианское образование сегодня", "Бихевиористская теория обучения", "Теория открытия и конструктивизм", "Память", "Гуманистическая теория", "Триада человеческого опыта"];
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let st=ld('st',{}),cfg=ld('cfg',{}),queue=[],cur=null,shown=false;
const $=id=>document.getElementById(id);
$('sec').innerHTML='<option value="">Все разделы</option>'+SECS.map(s=>'<option>'+s+'</option>').join('');
$('sec').value=cfg.sec||'';$('rev').checked=!!cfg.rev;$('onlyhard').checked=!!cfg.hard;
const known=i=>(st[i]||0)>=2;
function saveCfg(){sv('cfg',{sec:$('sec').value,rev:$('rev').checked,hard:$('onlyhard').checked})}
function build(){saveCfg();let ids=CARDS.map((_,i)=>i);const s=$('sec').value;
if(s)ids=ids.filter(i=>CARDS[i].t===s);if($('onlyhard').checked)ids=ids.filter(i=>!known(i));
for(let i=ids.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[ids[i],ids[j]]=[ids[j],ids[i]]}queue=ids;next()}
function stats(){const k=CARDS.filter((_,i)=>known(i)).length;$('s1').textContent='Выучено: '+k+' / '+CARDS.length;$('s2').textContent='В очереди: '+queue.length;$('b').style.width=k/CARDS.length*100+'%'}
function next(){sv('q',{queue,key:$('sec').value+'|'+$('onlyhard').checked});stats();shown=false;$('show').hidden=false;$('ok').hidden=$('no').hidden=true;
if(!queue.length){cur=null;$('card').innerHTML='<div class="done"><h2>Круг пройден 🎉</h2><p>Смените раздел или начните заново.</p><button onclick="build()">Заново</button></div>';$('show').hidden=true;return}
cur=queue[0];const c=CARDS[cur],r=$('rev').checked;
$('card').innerHTML='<span class="tag"></span><div class="lbl"></div><div class="q"></div>';
const e=$('card');e.querySelector('.tag').textContent=c.t;e.querySelector('.lbl').textContent=(r?'Ответ':'Вопрос')+' №'+(cur+1);e.querySelector('.q').textContent=r?c.a:c.q;
if(c.c){const n=document.createElement('div');n.className='note';n.textContent='Контекст: '+c.c;e.append(n)}}
function reveal(){if(cur===null||shown)return;shown=true;const c=CARDS[cur],r=$('rev').checked;
const d=document.createElement('div');d.className='a';const l=document.createElement('div');l.className='lbl';l.textContent=r?'Вопрос':'Ответ';const t=document.createElement('div');t.textContent=r?c.q:c.a;d.append(l,t);$('card').append(d);
$('show').hidden=true;$('ok').hidden=$('no').hidden=false}
function answer(good){if(!shown)return;const i=queue.shift();
if(good){st[i]=(st[i]||0)+1}else{st[i]=0;queue.splice(Math.min(3,queue.length),0,i)}sv('st',st);next()}
$('show').onclick=reveal;$('card').onclick=()=>shown||reveal();$('ok').onclick=()=>answer(1);$('no').onclick=()=>answer(0);
$('rev').onchange=()=>{saveCfg();next()};$('onlyhard').onchange=$('sec').onchange=()=>build();

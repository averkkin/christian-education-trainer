return x}
function fmt(m){if(m<1)return'<1 мин';if(m<60)return Math.round(m)+' мин';if(m<1440)return(Math.round(m/6)/10+'').replace('.',',')+' ч';return Math.round(m/144)/10+' дн'}
const pool=()=>CARDS.filter(c=>!sel.length||sel.includes(c.t));
function pick(){const now=Date.now(),p=pool();
const l=p.filter(c=>get(c).s!=='new'&&get(c).due<=now).sort((a,b)=>get(a).due-get(b).due);
if(l[0])return l[0];
while(earlyQ.length){const id=earlyQ.shift(),c=p.find(c=>c.id===id);if(c&&get(c).s!=='new')return c}
return p.find(c=>get(c).s==='new')||null}
function early(){const p=pool().filter(c=>get(c).s!=='new').sort((a,b)=>get(a).due-get(b).due);
const w=p.filter(c=>get(c).lg<=2);earlyQ=(w.length?w:p).map(c=>c.id)}
function stats(){const now=Date.now(),p=pool();let n=0,l=0,r=0,k=0;
for(const c of p){const x=get(c);if(x.s==='new')n++;else{if(x.s==='review')k++;if(x.due<=now)x.s==='learn'?l++:r++}}
$('s1').textContent='Новые: '+n+' · Учатся: '+l+' · Повторить: '+r;$('s2').textContent='В повторении: '+k+' / '+p.length;$('b').style.width=(p.length?k/p.length*100:0)+'%'}
function render(){stats();shown=false;$('show').hidden=false;$('grades').hidden=true;
cur=pick();const e=$('card');
if(!cur){const p=pool().filter(c=>get(c).s!=='new');
 e.innerHTML='<div class="done"><h2>Пока всё 🎉</h2><p></p><button id="early" hidden>Учить досрочно</button></div>';
 if(p.length){const t=Math.min(...p.map(c=>get(c).due));e.querySelector('p').textContent='Следующая карточка через '+fmt(Math.max(0,(t-Date.now())/60000))+'. Страницу можно не закрывать — она сама покажет карточку.';
  const b=$('early');b.hidden=false;b.onclick=e=>{e.stopPropagation();early();render()}}
 else e.querySelector('p').textContent='В этом разделе нет карточек.';
 $('show').hidden=true;return}
const r=$('rev').checked;
e.innerHTML='<span class="tag"></span><div class="lbl"></div><div class="q"></div>';
e.querySelector('.tag').textContent=cur.t;e.querySelector('.lbl').textContent=(r?'Ответ':'Вопрос')+' №'+(CARDS.indexOf(cur)+1);e.querySelector('.q').textContent=r?cur.a:cur.q;
if(cur.c){const n=document.createElement('div');n.className='note';n.textContent='Контекст: '+cur.c;e.append(n)}}
function reveal(){if(!cur||shown)return;shown=true;const r=$('rev').checked,now=Date.now();
const d=document.createElement('div');d.className='a';const l=document.createElement('div');l.className='lbl';l.textContent=r?'Вопрос':'Ответ';const t=document.createElement('div');t.textContent=r?cur.q:cur.a;d.append(l,t);$('card').append(d);
document.querySelectorAll('#grades button').forEach(b=>b.querySelector('small').textContent=fmt((sched(cur,+b.dataset.g,now).due-now)/60000));
$('show').hidden=true;$('grades').hidden=false}
function answer(g){if(!shown||!cur)return;earlyQ=earlyQ.filter(i=>i!==cur.id);S[cur.id]=sched(cur,g,Date.now());sv('srs',S);render()}
$('show').onclick=reveal;$('card').onclick=()=>shown||reveal();
document.querySelectorAll('#grades button').forEach(b=>b.onclick=()=>answer(+b.dataset.g));
$('rev').onchange=()=>{cfg.rev=$('rev').checked;sv('cfg',cfg);render()};
$('reset').onclick=e=>{e.preventDefault();if(confirm('Сбросить весь прогресс?')){S={};sv('srs',S);render()}};
document.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();shown?answer(3):reveal()}else if('1234'.includes(e.key)&&e.key)answer(+e.key)};
setInterval(()=>{if(cur)stats();else render()},5000);
render();
</script></body></html>
